[config] 
#### Input
INPUT_BASE = {ENV[DATA]}/{ENV[VERIF_CASE]}_{ENV[STEP]}/data
MODEL1_STAT_ANALYSIS_LOOKIN_DIR = {INPUT_BASE}/{ENV[MODEL]}/{ENV[MODEL]}_v{ENV[DATE]}.stat, {INPUT_BASE}/{ENV[MODEL]}/revised_{ENV[REFERENCE]}_v{ENV[DATE]}.stat
MODEL2_STAT_ANALYSIS_LOOKIN_DIR = {INPUT_BASE}/{ENV[MODEL]}/revised_{ENV[REFERENCE]}_v{ENV[DATE]}.stat
SCRUB_STAGING_DIR = False
#### Output
OUTPUT_BASE = {ENV[DATA]}/{ENV[VERIF_CASE]}_{ENV[STEP]}/METplus_output
LOG_DIR = {OUTPUT_BASE}/logs
TMP_DIR = {ENV[MET_TMP_DIR]}
STAGING_DIR = {OUTPUT_BASE}/stage
STAT_ANALYSIS_OUTPUT_DIR = {OUTPUT_BASE}
STAT_ANALYSIS_OUT_STAT_TEMPLATE = {MODEL1}.{fcst_valid_end?fmt=%Y%m%d}/evs.stats.{MODEL1}.{ENV[RUN]}.{ENV[VERIF_CASE]}.sensibleweatherindex.v{fcst_valid_end?fmt=%Y%m%d}00.stat
LOG_METPLUS = {LOG_DIR}/{ENV[JOB_GROUP]}_StatAnalysis_{MODEL1}_{ENV[VERIF_CASE]}_{ENV[STEP]}_for{VALID_END}_00_runon{CLOCK_TIME}.log
METPLUS_CONF = {OUTPUT_BASE}/confs/{ENV[JOB_GROUP]}_StatAnalysis_{MODEL1}_{ENV[VERIF_CASE]}_{ENV[STEP]}_for{VALID_END}_00_runon{CLOCK_TIME}.conf
#### METplus application
PROCESS_LIST = StatAnalysis
#### Dates
LOOP_BY = VALID
VALID_TIME_FMT = %Y%m%d
VALID_BEG = {ENV[DATE]}
VALID_END = {ENV[DATE]}
VALID_INCREMENT = 24H
#### Model and observation
MODEL1 = {ENV[MODEL]}
MODEL2 = {ENV[REFERENCE]}
MODEL1_OBTYPE = {ENV[MODEL_OBNAME]}
MODEL2_OBTYPE = {ENV[REFERENCE_OBNAME]}
MODEL1_REFERENCE_NAME = {MODEL1}
MODEL2_REFERENCE_NAME = {MODEL2}
##### StatAnalysis
STAT_ANALYSIS_CONFIG_FILE = {PARM_BASE}/met_config/STATAnalysisConfig_wrapped
STAT_ANALYSIS_JOB_NAME = ss_index
STAT_ANALYSIS_JOB_ARGS = -out_stat [out_stat_file]
MODEL_LIST = {MODEL1}, {MODEL2}
DESC_LIST =
FCST_LEAD_LIST =
OBS_LEAD_LIST =
FCST_VALID_HOUR_LIST = 00
FCST_INIT_HOUR_LIST =
OBS_VALID_HOUR_LIST =
OBS_INIT_HOUR_LIST =
FCST_VAR_LIST = TMP, TMP, TMP, DPT, DPT, DPT, UGRD, UGRD, UGRD, VGRD, VGRD, VGRD, PRMSL, PRMSL, PRMSL
OBS_VAR_LIST =
FCST_UNITS_LIST =
OBS_UNITS_LIST =
FCST_LEVEL_LIST = Z2, Z2, Z2, Z2, Z2, Z2, Z10, Z10, Z10, Z10, Z10, Z10, Z0, Z0, Z0
OBS_LEVEL_LIST =
VX_MASK_LIST = CONUS, CONUS, CONUS, CONUS, CONUS, CONUS, CONUS, CONUS, CONUS, CONUS, CONUS, CONUS, CONUS, CONUS, CONUS
INTERP_MTHD_LIST =
INTERP_PNTS_LIST =
FCST_THRESH_LIST =
OBS_THRESH_LIST =
COV_THRESH_LIST =
ALPHA_LIST =
LINE_TYPE_LIST = SL1L2
GROUP_LIST_ITEMS = MODEL_LIST, LINE_TYPE_LIST
LOOP_LIST_ITEMS = 
STAT_ANALYSIS_MET_CONFIG_OVERRIDES = model = ["{ENV[MODEL]}", "{ENV[REFERENCE]}"]; obtype = ["{ENV[MODEL_OBNAME]}", "{ENV[REFERENCE_OBNAME]}"]; column = [ "RMSE" ]; weight = [10.0, 8.0, 5.0, 10.0, 8.0, 5.0, 8.0, 4.0, 2.0, 8.0, 4.0, 2.0, 10.0, 8.0, 6.0]; ss_index_name = "SENSIBLE_WEATHER_INDEX"; ss_index_vld_thresh = 1.0; fcst_lead = ["240000", "480000", "720000", "240000", "480000", "720000", "240000", "480000", "720000", "240000", "480000", "720000", "240000", "480000", "720000"];
